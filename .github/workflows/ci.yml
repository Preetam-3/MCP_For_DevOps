name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --prefix k8s-mcp
      - run: node k8s-mcp/test/safety.js
      - run: node k8s-mcp/test/unit.js
      - run: echo "PASS: lint + safety + unit checks"
