apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-readonly
  namespace: demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mcp-readonly
  namespace: demo
rules:
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mcp-readonly
  namespace: demo
subjects:
  - kind: ServiceAccount
    name: mcp-readonly
    namespace: demo
roleRef:
  kind: Role
  name: mcp-readonly
  apiGroup: rbac.authorization.k8s.io
